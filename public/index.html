<!DOCTYPE html>
<html>
<head>
  <title>Self-Extending Agent UI</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
    #chat { height: 500px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
    .message { margin: 10px 0; padding: 10px; border-radius: 8px; }
    .user { background: #007bff; color: white; margin-left: 20%; }
    .agent { background: #e9ecef; margin-right: 20%; }
    .skill { background: #d4edda; border-left: 4px solid #28a745; }
    input { width: 70%; padding: 10px; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🤖 Self-Extending Agent (powered by Ollama)</h1>
  <div id="chat"></div>
  <input id="input" type="text" placeholder="Ask anything... (e.g. explain redis in node.js)">
  <button onclick="send()">Send</button>
  <script>
    const AGENT_URL = 'http://localhost:4000/agent/complete';
    const chat = document.getElementById('chat');
    let loading = false;

    async function send() {
      const input = document.getElementById('input');
      const msg = input.value.trim();
      if (!msg || loading) return;
      input.value = '';
      loading = true;

      appendMessage('user', msg);
      try {
        const res = await fetch(AGENT_URL, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({query: msg}),
        });
        const data = await res.json();
        appendMessage('agent', data.answer || 'No response', data.usedSkill ? {className: 'skill', skill: data.usedSkill} : null);
        if (data.skillsCreated) appendMessage('agent', `✨ Created new skill(s)! Check /skills`, {className: 'skill'});
      } catch (e) {
        appendMessage('agent', 'Error: ' + e.message, {color: 'red'});
      }
      loading = false;
      input.focus();
    }

    function appendMessage(role, text, opts = {}) {
      const div = document.createElement('div');
      div.className = `message ${role} ${opts.className || ''}`;
      div.innerHTML = `<strong>${role.toUpperCase()}:</strong> ${text.replace(/\n/g, '<br>')}`;
      if (opts.skill) div.innerHTML += ` <em>(Skill: ${opts.skill})</em>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('input').addEventListener('keypress', e => {
      if (e.key === 'Enter') send();
    });
    document.getElementById('input').focus();
  </script>
</body>
</html>
